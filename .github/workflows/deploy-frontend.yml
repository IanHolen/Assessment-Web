name: Deploy Frontend (GitHub Pages)

# Compila el frontend React/Vite con un Node estable (evita el Node bleeding-edge local)
# y lo publica en GitHub Pages en /Assessment-Web/.

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (Vite)
        working-directory: front
        env:
          VITE_API_BASE_URL: https://crop-backend-pzmv.onrender.com/api
        run: |
          npm install --no-audit --no-fund
          npx vite build --base=/Assessment-Web/
          cp dist/index.html dist/404.html   # SPA fallback para Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
